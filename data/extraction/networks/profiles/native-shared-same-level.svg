<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1100" viewBox="0 0 1600 1100" font-family="Arial, Helvetica, sans-serif">
<rect width="1600" height="1100" fill="#ffffff"/>
<text x="40" y="43" font-size="28" fill="#23344b" font-weight="700" text-anchor="start">Two networks at one security level</text>
<text x="40" y="73" font-size="17" fill="#23344b" font-weight="400" text-anchor="start">Network 1 and Network 2 share Outer devices; their identities remain separate.</text>
<text x="40" y="101" font-size="15" fill="#56677d" font-weight="400" text-anchor="start">19 devices / 20 virtual links. Device IDs have the prefix NT_.</text>
