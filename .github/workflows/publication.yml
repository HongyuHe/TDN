name: Check and publish explorers

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tdn-website-publication-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Check publication inputs and GitHub source locations
        run: python3 scripts/publication/export_pages.py --check
      - name: Check the publication installer
        run: python3 -m unittest discover -s tests -p test_publication.py

  publish:
    needs: validate
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Checkout the website with its dedicated deploy key
        uses: actions/checkout@v5
        with:
          repository: HongyuHe/hongyuhe.github.io
          ref: master
          path: _website
          ssh-key: ${{ secrets.TDN_WEBSITE_DEPLOY_KEY }}
      - name: Update the two standalone pages
        run: python3 scripts/publication/sync_website.py _website
